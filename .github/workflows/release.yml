name: Release

# Tag a commit to cut a release:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example v0.2.0"
        required: true

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  artifacts:
    name: Addon and server binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Verify the server before shipping it
        working-directory: server
        run: |
          go vet ./...
          go test ./...

      - name: Package
        run: scripts/package.sh "${VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Melay ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/melay-addon-*.zip
            dist/melay-*.tar.gz
            dist/melay-*.zip
            dist/SHA256SUMS
          body: |
            ## Install the addon

            Download `melay-addon-${{ env.VERSION }}.zip` and extract it into your Godot
            project root, so the files land in `addons/melay/`. Then enable **Melay** under
            *Project > Project Settings > Plugins*.

            ## Run the relay

            ```bash
            docker run -d -p 8890:8890 -v melay-data:/data \
              ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ```

            Or download a binary below. Every archive is listed in `SHA256SUMS`.

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest
